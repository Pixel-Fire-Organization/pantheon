name: 'Build macOS'
description: 'Installs the Python tool deps, builds the universal macOS bundle with the engine build script, and checks that it carries both architectures and is signed'

inputs:
  build_type:
    description: 'Type of build (debug, release)'
    required: true
    default: 'debug'

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'

    - name: Install Python tool dependencies (cook/pack scripts CMake shells out to)
      shell: bash
      run: pip install -r tools/requirements-ci.txt

    - name: Build engine via Script
      shell: bash
      run: python3 ./tools/build.py ${{ inputs.build_type }} --platforms MACOS

    - name: Check the bundle carries both architectures and is signed
      shell: bash
      run: |
        bundle=$(ls -d dist/macos/*.app)
        executable="$bundle/Contents/MacOS/game"
        library="$bundle/Contents/Frameworks/libwgpu_native.dylib"
        for file in "$executable" "$library"; do
          archs=$(lipo -archs "$file")
          echo "$file: $archs"
          case "$archs" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *) echo "::error::$file is not universal ($archs)"; exit 1 ;;
          esac
        done
        codesign --verify --deep --strict "$bundle"
        "$executable" --help
