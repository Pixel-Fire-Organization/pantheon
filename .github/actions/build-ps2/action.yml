name: 'Build PS2 Engine'
description: 'Installs dependencies and runs the engine build script'

inputs:
  build_type:
    description: 'Type of build (debug, release)'
    required: true
    default: 'debug'
  region:
    description: 'Region (PAL, NTSC)'
    required: true
    default: 'PAL'

runs:
  using: "composite"
  steps:
    - name: Install build dependencies
      shell: sh
      run: |
        # gcompat provides the glibc dynamic linker this Alpine image otherwise
        # lacks; tools/ps2/masp (see docs/ps2/MASP.md) is a glibc-linked binary
        # and fails to exec without it.
        apk add --no-cache build-base bash cmake cdrkit p7zip zlib texinfo flex bison gettext gmp-dev mpfr-dev mpc1-dev zlib-dev python3 py3-pillow py3-jsonschema gcompat

    - name: Trust workspace for git (container runs as root; workspace owned by host user)
      shell: sh
      run: git config --global --add safe.directory '*'

    - name: Build engine via Script
      shell: bash
      run: |
        python3 ./tools/build.py ${{ inputs.build_type }} ${{ inputs.region }}