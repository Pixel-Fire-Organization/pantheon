name: Lint and Security Checks

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  check-style:
    name: Clang-Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check code formatting
        run: |
          find engine game -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) -exec clang-format --dry-run --Werror {} +

  analyze-cppcheck:
    name: Cppcheck Security Scan
    needs: check-style
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Run Cppcheck Analysis
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ghcr.io/ps2dev/ps2sdk-ports@sha256:cb24a07ad515e2144d7bd02c9bf5854f393c3c069897ba1a48a6a6796e5339af sh -c "
            apk add --no-cache build-base cmake cppcheck python3
          
            cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          
            # Added unmatchedSuppression to prevent locationless internal warnings
            cppcheck --project=build/compile_commands.json \
              --enable=all \
              --inconclusive \
              --xml --xml-version=2 \
              --suppress=*:external/* \
              --suppress=missingIncludeSystem \
              --suppress=missingInclude \
              --suppress=unmatchedSuppression \
              2> cppcheck-report.xml
          
            chmod 666 cppcheck-report.xml
          "

      - name: Convert Cppcheck XML to SARIF
        uses: Flast/cppcheck-sarif@2845d63261f33914953ac34cbfb2c6b105b6780e # v2
        with:
          input: 'cppcheck-report.xml'
          output: 'cppcheck.sarif'

      - name: Clean Invalid SARIF Results
        run: |
          # This filter now explicitly checks that:
          # 1. The locations array exists and has at least 1 item.
          # 2. A valid file path (uri) exists.
          # 3. The starting line is >= 1.
          jq '(.runs[].results) |= map(select(
            .locations != null and 
            (.locations | length > 0) and 
            try (
              .locations[0].physicalLocation.artifactLocation.uri != null and 
              .locations[0].physicalLocation.artifactLocation.uri != "" and 
              .locations[0].physicalLocation.region.startLine >= 1
            ) catch false
          ))' cppcheck.sarif > cppcheck-cleaned.sarif

      - name: Upload Analysis to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: 'cppcheck-cleaned.sarif'
          category: 'cppcheck'