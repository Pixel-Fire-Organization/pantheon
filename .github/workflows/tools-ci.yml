name: Tools CI

# Fast host-side checks for the Python asset/codegen tools (no PS2 toolchain).
# Validates ECS.json, runs the generator golden + negative-fixture tests, and
# enforces that the committed TrenchBroom FGD has not drifted from ECS.json.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install tool dependencies
        run: pip install -r tools/requirements-ci.txt

      - name: Run tool tests
        run: python -m pytest tools/tests -q

      - name: Check ECS FGD is not drifted from ECS.json
        run: |
          python tools/ECS/generate_ecs.py \
            --ecs tools/ECS/ECS.json --schema tools/ECS/schema.json \
            --out-fgd /tmp/Pantheon.fgd
          if ! diff -u tools/trenchbroom/games/Pantheon/Pantheon.fgd /tmp/Pantheon.fgd; then
            echo "::error::ECS.json and the committed Pantheon.fgd have drifted." \
                 "Run: python tools/ECS/generate_ecs.py --ecs tools/ECS/ECS.json" \
                 "--schema tools/ECS/schema.json --out-fgd" \
                 "tools/trenchbroom/games/Pantheon/Pantheon.fgd  and commit the result."
            exit 1
          fi
